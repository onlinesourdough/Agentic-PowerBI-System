name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check package metadata
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json ok')"
      - name: Run doctor (non-fatal optional tools)
        run: node scripts/doctor.mjs || true
      - name: Validate sample/template project structure
        run: node scripts/validate-pbip.mjs .
