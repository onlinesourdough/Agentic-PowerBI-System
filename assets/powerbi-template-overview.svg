<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">PowerBI-template workflow</title>
  <desc id="desc">A business question moves through definitions and data, model, report, decision, and proof.</desc>
  <rect width="1600" height="760" rx="42" fill="#f3efe6"/>
  <text x="88" y="84" fill="#756f62" font-family="ui-monospace,monospace" font-size="22" letter-spacing="3">ONLINESOURDOUGH · POWERBI-TEMPLATE</text>
  <text x="88" y="174" fill="#25241f" font-family="ui-sans-serif,system-ui" font-size="62" font-weight="750" letter-spacing="-3">Bake the report around the decision.</text>
  <g font-family="ui-sans-serif,system-ui">
    <g transform="translate(88 252)"><rect width="222" height="238" rx="26" fill="#fffdf8" stroke="#d8d1c3" stroke-width="2"/><text x="25" y="48" fill="#d5673f" font-size="17" font-weight="700">QUESTION</text><text x="25" y="98" fill="#25241f" font-size="28" font-weight="700">What changes?</text><text x="25" y="138" fill="#666257" font-size="17">Audience, owner,</text><text x="25" y="166" fill="#666257" font-size="17">decision and proof.</text></g>
    <g transform="translate(345 252)"><rect width="222" height="238" rx="26" fill="#fffdf8" stroke="#d8d1c3" stroke-width="2"/><text x="25" y="48" fill="#d5673f" font-size="17" font-weight="700">DEFINITIONS</text><text x="25" y="98" fill="#25241f" font-size="28" font-weight="700">Name the grain</text><text x="25" y="138" fill="#666257" font-size="17">KPIs, source,</text><text x="25" y="166" fill="#666257" font-size="17">freshness, access.</text></g>
    <g transform="translate(602 252)"><rect width="222" height="238" rx="26" fill="#fffdf8" stroke="#d8d1c3" stroke-width="2"/><text x="25" y="48" fill="#d5673f" font-size="17" font-weight="700">MODEL</text><text x="25" y="98" fill="#25241f" font-size="28" font-weight="700">Make it mean</text><text x="25" y="138" fill="#666257" font-size="17">Relationships,</text><text x="25" y="166" fill="#666257" font-size="17">measures, rules.</text></g>
    <g transform="translate(859 252)"><rect width="222" height="238" rx="26" fill="#fffdf8" stroke="#d8d1c3" stroke-width="2"/><text x="25" y="48" fill="#d5673f" font-size="17" font-weight="700">REPORT</text><text x="25" y="98" fill="#25241f" font-size="28" font-weight="700">Show the signal</text><text x="25" y="138" fill="#666257" font-size="17">One page per</text><text x="25" y="166" fill="#666257" font-size="17">business question.</text></g>
    <g transform="translate(1116 252)"><rect width="222" height="238" rx="26" fill="#273f32"/><text x="25" y="48" fill="#f2bd9f" font-size="17" font-weight="700">DECISION</text><text x="25" y="98" fill="#ffffff" font-size="28" font-weight="700">Choose and act</text><text x="25" y="138" fill="#dfe8e1" font-size="17">Evidence beside</text><text x="25" y="166" fill="#dfe8e1" font-size="17">the named owner.</text></g>
    <g transform="translate(1373 252)"><rect width="139" height="238" rx="26" fill="#f3c98b"/><text x="20" y="48" fill="#674120" font-size="17" font-weight="700">PROOF</text><text x="20" y="98" fill="#3b2b1c" font-size="25" font-weight="700">Fresh.</text><text x="20" y="132" fill="#3b2b1c" font-size="25" font-weight="700">Correct.</text><text x="20" y="166" fill="#3b2b1c" font-size="25" font-weight="700">Useful.</text></g>
  </g>
  <g fill="none" stroke="#d5673f" stroke-width="4" stroke-linecap="round"><path d="M311 371H334"/><path d="M568 371H591"/><path d="M825 371H848"/><path d="M1082 371H1105"/><path d="M1339 371H1362"/></g>
  <g fill="#d5673f"><path d="m334 371-12-7v14z"/><path d="m591 371-12-7v14z"/><path d="m848 371-12-7v14z"/><path d="m1105 371-12-7v14z"/><path d="m1362 371-12-7v14z"/></g>
  <rect x="88" y="550" width="1424" height="74" rx="20" fill="#fffdf8" stroke="#d8d1c3" stroke-width="2"/>
  <text x="116" y="596" fill="#756f62" font-family="ui-sans-serif,system-ui" font-size="20">Optional Design-template handoff in · measured business learning back to AIOS</text>
  <text x="88" y="702" fill="#756f62" font-family="ui-sans-serif,system-ui" font-size="20">No chart buffet. Serve the decision.</text>
</svg>
